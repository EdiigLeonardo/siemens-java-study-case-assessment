apiVersion: v1
kind: ServiceAccount
metadata: { name: expenses-sa }
---
# BUG: RoleBinding a cluster-admin para uma app comum - qualquer falha de
# seguranca no backend da acesso total ao cluster (RBAC demasiado permissivo).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: expenses-sa-binding }
subjects: [{ kind: ServiceAccount, name: expenses-sa, namespace: default }]
roleRef: { kind: ClusterRole, name: cluster-admin, apiGroup: rbac.authorization.k8s.io }
