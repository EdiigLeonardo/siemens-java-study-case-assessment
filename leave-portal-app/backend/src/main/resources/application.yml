server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:leaveportal}
    username: ${DB_USER:leaveportal}
    password: ${DB_PASSWORD:leaveportal}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
