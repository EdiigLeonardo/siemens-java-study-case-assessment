services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: selfservice
      POSTGRES_USER: selfservice
      POSTGRES_PASSWORD: selfservice   # BUG: password em texto plano no compose
    ports: ["5432:5432"]

  backend:
    build: ../backend
    environment:
      DB_HOST: db
      DB_NAME: selfservice
      DB_USER: selfservice
      DB_PASSWORD: selfservice
    ports: ["8080:8080"]
    depends_on: [db]   # BUG: nao espera o Postgres estar "ready", so "started"

  frontend:
    build: ../frontend
    ports: ["4200:80"]
    depends_on: [backend]
