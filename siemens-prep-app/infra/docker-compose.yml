services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # BUG: password em texto plano no compose
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s       # Time between checks
      timeout: 5s         # Time to wait before considering the check failed
      retries: 5          # Number of consecutive failures before marking unhealthy
      start_period: 10s   # Warm-up time; failures here don't count toward retries

  backend:
    build: ../backend
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy # 1. Instructs 'web' to wait for a healthy status
        restart: true     # BUG: nao espera o Postgres estar "ready", so "started"

  frontend:
    build: ../frontend
    ports: ["4200:80"]
    depends_on: [backend]
